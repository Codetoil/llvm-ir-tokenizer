[project]
name = "llvm-ir-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angelina Michalek", email = "ianthisawesomee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch",
    "transformers",
    "tokenizers",
    "datasets",
    "trl",
    "pygments",
    "unsloth==2026.11.4",
    "unsloth-zoo==2026.11.4",
]

[project.scripts]
phase-1 = "llvm_ir_tokenizer.phase_1_preprocess_corpus:main"
phase-2 = "llvm_ir_tokenizer.phase_2_serializers:main"
phase-3 = "llvm_ir_tokenizer.phase_3_train_tokenizers:main"
phase-4 = "llvm_ir_tokenizer.phase_4_global_vocabulary:main"
phase-5 = "llvm_ir_tokenizer.phase_5_train_llm:main"
phase-6 = "llvm_ir_tokenizer.phase_6_export_and_interface:main"
phase-7 = "llvm_ir_tokenizer.phase_7_validation:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
